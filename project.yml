name: FanControl
# 注意：请用 scripts/bootstrap-project.sh 生成工程（会修正 objectVersion 为 60，
# 兼容 CI 的 Xcode 15.4；XcodeGen 2.45 目前仍硬编码输出 77）。
options:
  bundleIdPrefix: local.fancontrol
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "6"
    CODE_SIGN_IDENTITY: "-"            # adhoc 自签，无开发者账号
    CODE_SIGNING_REQUIRED: NO
    ENABLE_HARDENED_RUNTIME: NO
targets:
  FanControl:
    type: application
    platform: macOS
    sources:
      - path: FanControl
    postBuildScripts:
      - name: Embed smctl binaries
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="$SRCROOT/vendor/smctl"
          DST="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH"
          # smctl daemon install 要求 smctld 与 smctl 同目录，必须一起拷
          if [ -x "$SRC/smctl" ] && [ -x "$SRC/smctld" ]; then
            cp -f "$SRC/smctl" "$SRC/smctld" "$DST/"
          else
            echo "warning: 未找到 vendor/smctl/{smctl,smctld}，app 将无法工作。请从 smctl GitHub Releases 下载 arm64 二进制后重试。"
          fi
    settings:
      base:
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        PRODUCT_BUNDLE_IDENTIFIER: local.fancontrol.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES          # 菜单栏 app，不占 Dock
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    scheme:
      testTargets: []
